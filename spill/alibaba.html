<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ali Babas Skatt – ALLANDIN</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@400;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:#04010f;display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;font-family:'Cinzel',serif;color:#f5c842;overflow:hidden;
}
a.back{
  position:fixed;top:14px;left:14px;z-index:5;text-decoration:none;color:#c8a060;
  font-size:0.72rem;letter-spacing:3px;border:1px solid rgba(200,160,96,0.4);
  padding:6px 14px;transition:all 0.2s;
}
a.back:hover{background:#f5c842;color:#04010f;border-color:#f5c842;}
#wrap{position:relative;width:700px;max-width:100vw;}
#hud{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 16px;background:rgba(0,0,0,0.5);
  border-bottom:1px solid rgba(245,200,66,0.3);
}
.hud-val{font-size:1rem;letter-spacing:2px;color:#f5c842;}
.hud-lbl{font-size:0.55rem;letter-spacing:3px;color:#c8a060;margin-bottom:2px;}
#gc{display:block;max-width:100%;background:#04010f;}
#overlay{
  position:absolute;top:40px;left:0;width:100%;height:calc(100% - 40px);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:rgba(4,1,15,0.9);pointer-events:none;
}
#overlay.hide{display:none;}
.t-arabic{font-size:clamp(0.8rem,2vw,1.1rem);color:#c8a060;margin-bottom:0.6rem;letter-spacing:6px;}
.t-title{
  font-family:'Cinzel Decorative',serif;font-size:clamp(1.4rem,4.5vw,2.6rem);
  color:#f5c842;text-shadow:0 0 30px rgba(245,200,66,0.5);
  margin-bottom:0.4rem;letter-spacing:4px;text-align:center;
}
.t-sub{font-size:0.68rem;letter-spacing:2px;color:rgba(200,160,96,0.75);margin-top:0.4rem;text-align:center;max-width:520px;}
.ornament{font-size:1.1rem;color:#c8a060;margin:0.4rem 0;}
.btn{
  margin-top:1rem;padding:10px 32px;background:transparent;border:1px solid #f5c842;
  color:#f5c842;font-family:'Cinzel',serif;font-size:0.82rem;
  letter-spacing:3px;cursor:pointer;pointer-events:all;transition:all 0.2s;
}
.btn:hover{background:#f5c842;color:#04010f;}
#tip{font-size:0.58rem;letter-spacing:2px;color:rgba(200,160,96,0.5);padding:6px 16px;text-align:center;background:rgba(0,0,0,0.4);}
#wordbox{
  position:absolute;bottom:50px;left:50%;transform:translateX(-50%);
  font-family:'Cinzel Decorative',serif;font-size:1.6rem;letter-spacing:8px;
  color:#f5c842;text-shadow:0 0 20px rgba(245,200,66,0.6);
  padding:10px 24px;background:rgba(0,0,0,0.5);
  border:1px solid rgba(245,200,66,0.3);
  pointer-events:none;user-select:none;
}
#wordbox .done{color:#fff;}
#wordbox .miss{color:#c8a060;opacity:0.35;}
</style>
</head>
<body>
<a href="../index.html" class="back">← TILBAKE</a>
<div id="wrap">
  <div id="hud">
    <div><div class="hud-lbl">SKATTER</div><div class="hud-val" id="h-score">0</div></div>
    <div style="text-align:center"><div class="hud-lbl">BØLGE</div><div class="hud-val" id="h-wave">1</div></div>
    <div style="text-align:right"><div class="hud-lbl">LIV</div><div class="hud-val" id="h-lives">♦ ♦ ♦</div></div>
  </div>
  <canvas id="gc" width="700" height="420"></canvas>
  <div id="wordbox"></div>
  <div id="overlay">
    <div class="t-arabic">✦ علي بابا ✦</div>
    <div class="t-title">ALI BABAS SKATT</div>
    <div class="ornament">⟡ ⟡ ⟡</div>
    <div class="t-sub">SKRIV DET MAGISKE ORDET FOR Å ÅPNE HULEN</div>
    <div class="t-sub" style="margin-top:0.6rem;">TAST BOKSTAV FOR BOKSTAV · SKATT ÅPNES · UNNGÅ DE 40 RØVERNE</div>
    <button class="btn" onclick="begin()">✦ TIL HULEN ✦</button>
  </div>
  <div id="tip">✦ skriv ordet under · hver fullførte rune gir skatter · tyver stjeler liv ✦</div>
</div>

<script>
const cv=document.getElementById('gc'),ctx=cv.getContext('2d');
const W=cv.width,H=cv.height;
const WORDS=['SIMSALABIM','SESAM','ALADDIN','DJINNI','KAIRO','BAGDAD','BASRA','SHERAZAD','LAMPEN','TEPPE'];
let state='menu',score=0,wave=1,lives=3,frame=0;
let target='',idx=0,wordTimer=0;
let thieves=[],parts=[],runes=[];
let stars=[];
for(let i=0;i<90;i++)stars.push({x:Math.random()*W,y:Math.random()*H*0.8,r:Math.random()*1.3+0.3,t:Math.random()*6,s:0.01+Math.random()*0.02});

function drawBG(){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#04010f');g.addColorStop(0.6,'#0d0520');g.addColorStop(1,'#180a05');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  stars.forEach(s=>{
    s.t+=s.s;const a=0.3+Math.sin(s.t)*0.5;
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fillStyle=`rgba(255,250,200,${a})`;ctx.fill();
  });
  // cave arch
  ctx.fillStyle='#0a0308';
  ctx.beginPath();
  ctx.moveTo(0,H);
  ctx.lineTo(0,H*0.35);
  ctx.quadraticCurveTo(W*0.15,H*0.1,W*0.5,H*0.08);
  ctx.quadraticCurveTo(W*0.85,H*0.1,W,H*0.35);
  ctx.lineTo(W,H);
  ctx.closePath();ctx.fill();
  // inner arch
  const openAmt=Math.min(1,idx/Math.max(1,target.length));
  ctx.fillStyle='#2a1208';
  const aw=130+openAmt*140,ah=160+openAmt*100;
  ctx.beginPath();
  ctx.ellipse(W/2,H*0.55,aw/2,ah/2,0,Math.PI,0);
  ctx.rect(W/2-aw/2,H*0.55,aw,ah/2);
  ctx.fill();
  // gold glow inside when open
  if(openAmt>0.2){
    const gl=ctx.createRadialGradient(W/2,H*0.55,10,W/2,H*0.55,aw*1.2);
    gl.addColorStop(0,`rgba(245,200,66,${openAmt*0.55})`);
    gl.addColorStop(1,'rgba(245,200,66,0)');
    ctx.fillStyle=gl;
    ctx.beginPath();ctx.ellipse(W/2,H*0.55,aw/2,ah/2,0,Math.PI,0);
    ctx.rect(W/2-aw/2,H*0.55,aw,ah/2);ctx.fill();
  }
  // treasure behind
  if(openAmt>0.5){
    ctx.fillStyle='rgba(245,200,66,0.7)';
    for(let i=0;i<10;i++){
      const x=W/2+(i-5)*15+Math.sin(frame*0.05+i)*2;
      const y=H*0.75+Math.cos(frame*0.05+i)*2;
      ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fill();
    }
  }
  // arch trim
  ctx.strokeStyle='rgba(245,200,66,0.4)';ctx.lineWidth=2;
  ctx.beginPath();
  ctx.ellipse(W/2,H*0.55,aw/2,ah/2,0,Math.PI,0);ctx.stroke();
  // sand floor
  ctx.fillStyle='#241005';ctx.fillRect(0,H-22,W,22);
}

function drawThief(t){
  ctx.save();ctx.translate(t.x,t.y);
  if(t.vx<0)ctx.scale(-1,1);
  // shadow
  ctx.fillStyle='rgba(0,0,0,0.35)';
  ctx.beginPath();ctx.ellipse(0,18,18,4,0,0,Math.PI*2);ctx.fill();
  // body / robe
  ctx.fillStyle='#2a1010';
  ctx.beginPath();
  ctx.moveTo(-14,15);ctx.lineTo(-10,-8);ctx.lineTo(10,-8);ctx.lineTo(14,15);ctx.closePath();ctx.fill();
  // head
  ctx.fillStyle='#c8a060';
  ctx.beginPath();ctx.arc(0,-12,8,0,Math.PI*2);ctx.fill();
  // mask
  ctx.fillStyle='#1a0505';
  ctx.fillRect(-8,-14,16,5);
  // eyes
  ctx.fillStyle='#ff3020';
  ctx.beginPath();ctx.arc(-3,-12,1.2,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(3,-12,1.2,0,Math.PI*2);ctx.fill();
  // turban
  ctx.fillStyle='#5a1010';
  ctx.beginPath();ctx.ellipse(0,-19,9,4,0,0,Math.PI*2);ctx.fill();
  // dagger
  ctx.fillStyle='#c8c8d0';
  ctx.beginPath();ctx.moveTo(10,0);ctx.lineTo(18,-2);ctx.lineTo(18,2);ctx.fill();
  ctx.fillStyle='#f5c842';ctx.fillRect(9,-1.5,2,3);
  ctx.restore();
}

function drawRune(r){
  if(r.life<=0)return;
  ctx.save();ctx.translate(r.x,r.y);
  ctx.globalAlpha=r.life;
  ctx.fillStyle='#f5c842';ctx.strokeStyle='#fff';ctx.lineWidth=1;
  ctx.font='bold 26px "Cinzel Decorative", serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(r.ch,0,0);
  ctx.restore();
  ctx.globalAlpha=1;
}

function burst(x,y,cols){
  for(let i=0;i<14;i++)parts.push({
    x,y,vx:(Math.random()-.5)*6,vy:(Math.random()-1)*5,life:1,r:2+Math.random()*3,
    c:cols[Math.floor(Math.random()*cols.length)]
  });
}

function drawParts(){
  parts=parts.filter(p=>p.life>0);
  parts.forEach(p=>{
    ctx.globalAlpha=p.life;ctx.fillStyle=p.c;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);ctx.fill();
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.07;p.life-=0.03;
  });
  ctx.globalAlpha=1;
}

function newWord(){
  target=WORDS[Math.floor(Math.random()*WORDS.length)];
  idx=0;wordTimer=target.length*70+180;
  renderWord();
}

function renderWord(){
  const wb=document.getElementById('wordbox');
  let h='';
  for(let i=0;i<target.length;i++){
    if(i<idx)h+=`<span class="done">${target[i]}</span>`;
    else if(i===idx)h+=`<span>${target[i]}</span>`;
    else h+=`<span class="miss">${target[i]}</span>`;
  }
  wb.innerHTML=h;
}

function onKey(e){
  if(state!=='play')return;
  const k=(e.key||'').toUpperCase();
  if(!/^[A-ZÆØÅ]$/.test(k))return;
  if(k===target[idx]){
    idx++;
    runes.push({x:W/2+(idx-target.length/2)*18,y:H*0.55,ch:k,life:1});
    if(idx>=target.length){
      const bonus=target.length*2;
      score+=bonus;
      document.getElementById('h-score').textContent=score;
      burst(W/2,H*0.55,['#f5c842','#fff','#ff9030','#c87020']);
      newWord();
    }
    renderWord();
  } else {
    idx=Math.max(0,idx-1);
    renderWord();
    burst(W/2,H*0.85,['#ff3020','#8a1010']);
  }
}

function die(){
  burst(W/2,H-40,['#ff3020','#f5c842','#fff']);
  lives--;
  document.getElementById('h-lives').textContent=('♦ '.repeat(Math.max(0,lives))).trim()||'—';
  if(lives<=0)end();
}

function end(){
  state='over';
  const ov=document.getElementById('overlay');
  ov.classList.remove('hide');
  ov.querySelector('.t-title').textContent='RØVERNE FANGET DEG';
  const subs=ov.querySelectorAll('.t-sub');
  subs[0].innerHTML=`Skatter: <b style="color:#f5c842;">${score}</b> &nbsp;·&nbsp; Bølge: <b style="color:#f5c842;">${wave}</b>`;
  if(subs[1])subs[1].textContent='';
  ov.querySelector('.btn').textContent='✦ PRØV IGJEN ✦';
  document.getElementById('wordbox').innerHTML='';
}

function begin(){
  state='play';score=0;wave=1;lives=3;frame=0;
  thieves=[];parts=[];runes=[];
  document.getElementById('h-score').textContent='0';
  document.getElementById('h-wave').textContent='1';
  document.getElementById('h-lives').textContent='♦ ♦ ♦';
  document.getElementById('overlay').classList.add('hide');
  newWord();
}

function loop(){
  ctx.clearRect(0,0,W,H);
  drawBG();
  if(state==='play'){
    frame++;
    wordTimer--;
    if(wordTimer<=0){
      idx=0;renderWord();
      burst(W/2,H*0.85,['#ff3020','#8a1010']);
      die();
      if(lives>0)newWord();
    }
    const sp=90-Math.min(70,wave*4);
    if(frame%sp===0){
      const fromLeft=Math.random()<0.5;
      thieves.push({x:fromLeft?-30:W+30,y:H-40,vx:(fromLeft?1:-1)*(1+wave*0.12+Math.random()*0.6)});
    }
    thieves.forEach(t=>{t.x+=t.vx;});
    thieves=thieves.filter(t=>{
      if((t.vx>0&&t.x>W+40)||(t.vx<0&&t.x<-40)){die();return false;}
      return true;
    });
    runes.forEach(r=>{r.life-=0.015;r.y-=0.3;});
    runes=runes.filter(r=>r.life>0);
    if(frame%600===0){wave++;document.getElementById('h-wave').textContent=wave;}
  }
  thieves.forEach(drawThief);
  runes.forEach(drawRune);
  drawParts();
  requestAnimationFrame(loop);
}

document.addEventListener('keydown',onKey);
loop();
</script>
</body>
</html>
