<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slangetemmeren – ALLANDIN</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@400;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:#04010f;min-height:100vh;font-family:'Cinzel',serif;color:#f5c842;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  padding:14px;
  background-image:
    radial-gradient(ellipse at 20% 10%,rgba(80,20,120,0.18),transparent 60%),
    radial-gradient(ellipse at 80% 90%,rgba(200,80,20,0.15),transparent 60%);
}
a.back{
  position:fixed;top:14px;left:14px;text-decoration:none;color:#c8a060;
  font-size:0.72rem;letter-spacing:3px;border:1px solid rgba(200,160,96,0.4);
  padding:6px 14px;transition:all 0.2s;
}
a.back:hover{background:#f5c842;color:#04010f;border-color:#f5c842;}
.title{
  font-family:'Cinzel Decorative',serif;font-size:clamp(1.4rem,4vw,2.2rem);
  color:#f5c842;text-shadow:0 0 30px rgba(245,200,66,0.4);
  letter-spacing:4px;margin-top:8px;
}
.arabic{font-size:0.95rem;color:#c8a060;letter-spacing:5px;margin:4px 0 6px;}
.sub{font-size:0.62rem;color:rgba(200,160,96,0.7);letter-spacing:3px;}
#hud{
  display:flex;gap:30px;margin:14px 0 10px;padding:8px 22px;
  background:rgba(0,0,0,0.4);border:1px solid rgba(245,200,66,0.25);
}
.hud-cell{text-align:center;}
.hud-lbl{font-size:0.55rem;letter-spacing:3px;color:#c8a060;margin-bottom:3px;}
.hud-val{font-size:1rem;color:#f5c842;letter-spacing:2px;}
#stage{position:relative;}
#gc{
  display:block;background:rgba(0,0,0,0.45);
  border:1px solid rgba(245,200,66,0.2);
  box-shadow:0 0 40px rgba(80,20,120,0.3) inset;
  max-width:100%;touch-action:none;
}
#overlay{
  position:absolute;inset:0;background:rgba(4,1,15,0.9);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:10;text-align:center;padding:10px;
}
#overlay.hidden{display:none;}
.btn{
  margin-top:18px;padding:10px 32px;
  background:transparent;border:1px solid #f5c842;
  color:#f5c842;font-family:'Cinzel',serif;font-size:0.82rem;
  letter-spacing:3px;cursor:pointer;transition:all 0.2s;
}
.btn:hover{background:#f5c842;color:#04010f;}
.ornament{font-size:1.1rem;color:#c8a060;margin:6px 0;}
.ov-stats{color:#fff;margin:8px 0;font-size:1rem;}
#footer{margin-top:16px;font-size:0.58rem;letter-spacing:2px;color:rgba(200,160,96,0.5);text-align:center;}
</style>
</head>
<body>
<a href="../index.html" class="back">← TILBAKE</a>
<div class="arabic">✦ حاوي الأفاعي ✦</div>
<div class="title">SLANGETEMMEREN</div>
<div class="sub">TEM SLANGEN OG SAML JUVELENE</div>
<div id="hud">
  <div class="hud-cell"><div class="hud-lbl">JUVELER</div><div class="hud-val" id="h-score">0</div></div>
  <div class="hud-cell"><div class="hud-lbl">LENGDE</div><div class="hud-val" id="h-len">3</div></div>
  <div class="hud-cell"><div class="hud-lbl">REKORD</div><div class="hud-val" id="h-hi">0</div></div>
</div>
<div id="stage">
  <canvas id="gc" width="440" height="440"></canvas>
  <div id="overlay">
    <div class="arabic">✦ حاوي الأفاعي ✦</div>
    <div class="title" id="ov-title">SLANGETEMMEREN</div>
    <div class="ornament">⟡ ⟡ ⟡</div>
    <div class="sub" id="ov-sub">PILTASTER ELLER SVEIP FOR Å STYRE</div>
    <div class="ov-stats" id="ov-stats"></div>
    <button class="btn" id="ov-btn" onclick="start()">✦ BEGYNN ✦</button>
  </div>
</div>
<div id="footer">✦ samle juveler 💎 for å vokse · unngå murene og din egen hale ✦</div>

<script>
const canvas=document.getElementById('gc');
const ctx=canvas.getContext('2d');
const CELL=20, COLS=22, ROWS=22;
let snake,dir,nextDir,food,score,hi=0,len,state='start',tickMs,acc=0,last=0;

function rndCell(){return {x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)};}

function placeFood(){
  let p;
  do{p=rndCell();}while(snake.some(s=>s.x===p.x&&s.y===p.y));
  food=p;
}

function start(){
  snake=[{x:8,y:11},{x:7,y:11},{x:6,y:11}];
  dir={x:1,y:0};nextDir={x:1,y:0};
  score=0;len=3;tickMs=140;acc=0;
  placeFood();
  document.getElementById('h-score').textContent='0';
  document.getElementById('h-len').textContent='3';
  document.getElementById('overlay').classList.add('hidden');
  state='playing';
}

function gameOver(){
  state='dead';
  if(score>hi){hi=score;document.getElementById('h-hi').textContent=hi;}
  const ov=document.getElementById('overlay');
  document.getElementById('ov-title').textContent='SLANGEN UNNSLAPP';
  document.getElementById('ov-sub').textContent='';
  document.getElementById('ov-stats').innerHTML=
    `Juveler: <b>${score}</b> &nbsp;·&nbsp; Lengde: <b>${len}</b> &nbsp;·&nbsp; Rekord: <b>${hi}</b>`;
  document.getElementById('ov-btn').textContent='✦ PRØV IGJEN ✦';
  ov.classList.remove('hidden');
}

function step(){
  dir=nextDir;
  const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  if(head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS){gameOver();return;}
  if(snake.some(s=>s.x===head.x&&s.y===head.y)){gameOver();return;}
  snake.unshift(head);
  if(head.x===food.x&&head.y===food.y){
    score++;len++;
    tickMs=Math.max(70,tickMs-2);
    document.getElementById('h-score').textContent=score;
    document.getElementById('h-len').textContent=len;
    placeFood();
  } else {
    snake.pop();
  }
}

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  // subtle grid
  ctx.strokeStyle='rgba(245,200,66,0.05)';ctx.lineWidth=1;
  for(let i=1;i<COLS;i++){ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,ROWS*CELL);ctx.stroke();}
  for(let j=1;j<ROWS;j++){ctx.beginPath();ctx.moveTo(0,j*CELL);ctx.lineTo(COLS*CELL,j*CELL);ctx.stroke();}
  // food jewel
  const fx=food.x*CELL+CELL/2, fy=food.y*CELL+CELL/2, t=Date.now()*0.005;
  ctx.save();ctx.translate(fx,fy);ctx.rotate(Math.PI/4);
  const r=6+Math.sin(t)*1.2;
  ctx.shadowColor='#f5c842';ctx.shadowBlur=14;
  ctx.fillStyle='#e8943a';ctx.fillRect(-r,-r,r*2,r*2);
  ctx.fillStyle='#f5c842';ctx.fillRect(-r*0.5,-r*0.5,r,r);
  ctx.restore();
  // snake
  snake.forEach((s,i)=>{
    const x=s.x*CELL, y=s.y*CELL;
    if(i===0){
      ctx.fillStyle='#f5c842';
      ctx.fillRect(x+2,y+2,CELL-4,CELL-4);
      // eyes
      ctx.fillStyle='#04010f';
      ctx.fillRect(x+CELL/2-4+dir.x*3,y+CELL/2-4+dir.y*3,3,3);
      ctx.fillRect(x+CELL/2+1+dir.x*3,y+CELL/2+1+dir.y*3,3,3);
    } else {
      const f=1-i/(snake.length+4);
      ctx.fillStyle=`rgba(${90+f*60|0},${40+f*40|0},${160+f*40|0},0.95)`;
      ctx.fillRect(x+3,y+3,CELL-6,CELL-6);
    }
  });
}

function loop(ts){
  const dt=ts-last;last=ts;
  if(state==='playing'){
    acc+=dt;
    if(acc>=tickMs){acc=0;step();}
    draw();
  }
  requestAnimationFrame(loop);
}

function setDir(x,y){
  // prevent reversing directly
  if(x===-dir.x&&y===-dir.y)return;
  nextDir={x,y};
}

document.addEventListener('keydown',e=>{
  const k=e.key;
  if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k))e.preventDefault();
  if(state!=='playing'){
    if(k===' '||k==='Enter')start();
    return;
  }
  if(k==='ArrowUp'||k==='w')setDir(0,-1);
  else if(k==='ArrowDown'||k==='s')setDir(0,1);
  else if(k==='ArrowLeft'||k==='a')setDir(-1,0);
  else if(k==='ArrowRight'||k==='d')setDir(1,0);
});

// touch swipe
let tsx=0,tsy=0;
canvas.addEventListener('touchstart',e=>{const t=e.touches[0];tsx=t.clientX;tsy=t.clientY;},{passive:true});
canvas.addEventListener('touchend',e=>{
  const t=e.changedTouches[0];
  const dx=t.clientX-tsx, dy=t.clientY-tsy;
  if(Math.abs(dx)<20&&Math.abs(dy)<20)return;
  if(Math.abs(dx)>Math.abs(dy))setDir(dx>0?1:-1,0);
  else setDir(0,dy>0?1:-1);
},{passive:true});

requestAnimationFrame(loop);
</script>
</body>
</html>
